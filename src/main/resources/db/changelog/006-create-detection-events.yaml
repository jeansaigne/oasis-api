databaseChangeLog:
  - changeSet:
      id: 006-create-detection-events
      author: oasis
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: detection_events
      changes:
        - createTable:
            tableName: detection_events
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: camera_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: label
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: confidence
                  type: DOUBLE
                  constraints:
                    nullable: false
              - column:
                  name: detected_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: received_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: detection_events
            indexName: idx_detection_events_detected_at
            columns:
              - column:
                  name: detected_at
        - createIndex:
            tableName: detection_events
            indexName: idx_detection_events_camera_id
            columns:
              - column:
                  name: camera_id
